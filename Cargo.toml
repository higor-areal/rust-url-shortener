[package]
name = "rust-url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.32", features = ["tokio-comp"] }
deadpool-redis = "0.22"